name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  npm:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify tag matches package version
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: node -e "const v='v'+require('./package.json').version; if (v !== process.env.TAG) throw new Error(v + ' != ' + process.env.TAG)"
      - run: node scripts/publish.mjs --metadata-only
      - run: npm run check
      - run: npm publish --access public --provenance --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: node scripts/publish.mjs --verify-registry --tag latest
